name: fernuni_discord_bot

services:

  scraper:
    # image: rndintusr/fuh-winfo-discordbot-grade-scraper:v1.0.0
    build:
      context: .
      dockerfile: scraper.Dockerfile
    user: appuser:appuser
    volumes:
      - ./data:/app/data

  plotter:
    # image: rndintusr/fuh-winfo-discordbot-grade-plotter:v1.0.0
    build:
      context: .
      dockerfile: plotter.Dockerfile
    user: appuser:appuser
    depends_on:
      - scraper
    volumes:
      - ./data:/app/data  
      - ./data/plots:/app/plots  

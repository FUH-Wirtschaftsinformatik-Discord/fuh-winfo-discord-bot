name: fernuni_discord_bot

services:

  bot:
    # image: rndintusr/fuh-winfo-discordbot:v1.1.4
    build:
      context: .
      dockerfile: bot.Dockerfile
    user: appuser:appuser
    env_file:
      - docker.env
    volumes:
      - ./data:/app/data
    # Python runs as PID 1 and ignores SIGTERM, so "docker compose stop" would kill the bot
    # after 10 s (exit 137). SIGINT raises KeyboardInterrupt, which discord.py handles by
    # closing the gateway session cleanly.
    stop_signal: SIGINT

  scraper:
    # image: rndintusr/fuh-winfo-discordbot-grade-scraper:v1.0.2
    build:
      context: .
      dockerfile: scraper.Dockerfile
    user: appuser:appuser
    depends_on:
      - bot    
    volumes:
      - ./data:/app/data

  plotter:
    # image: rndintusr/fuh-winfo-discordbot-grade-plotter:v1.0.5
    build:
      context: .
      dockerfile: plotter.Dockerfile
    user: appuser:appuser
    depends_on:
      - scraper
    volumes:
      - ./data:/app/data  
      - ./data/plots:/app/plots  

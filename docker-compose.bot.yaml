name: fernuni_discord_bot

services:

  bot:
    # image: rndintusr/fuh-winfo-discordbot:v0.1.2
    build:
      context: .
      dockerfile: bot.Dockerfile
    user: appuser:appuser
    env_file:
      - docker.env
    volumes:
      - ./data:/app/data
    # Python runs as PID 1 and ignores SIGTERM, so "docker compose stop" would kill the bot
    # after 10 s (exit 137). SIGINT raises KeyboardInterrupt, which discord.py handles by
    # closing the gateway session cleanly.
    stop_signal: SIGINT



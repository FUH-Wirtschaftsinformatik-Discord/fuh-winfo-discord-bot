# 1. Check current user and group IDs
# id -u
# id -g
# 2. mkdir -p data && sudo chown -R 1000:1000 ./data/
# 3. Adjust user and group IDs in docker-compose.deploy.yaml
# user: 1000:1000 # set to your user and group IDs

name: fernuni_discord_bot

services:
  bot:
    image: rndintusr/fuh-winfo-discordbot:v0.0.9
    user: appuser:appuser
    env_file:
      - docker.env
    volumes:
      - ./data:/app/data